<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sebuah Amplop Untukmu</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cinzel:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --gold: #d4a84b;
      --gold-soft: #f0dfb0;
      --gold-light: #faf0dc;
      --gold-glow: rgba(212, 168, 75, 0.25);
      --gold-line: rgba(212, 168, 75, 0.25);
      --ink: #0c0b0a;
      --ink-soft: #181613;
      --text: #e8e4dc;
      --text-soft: #a8a090;
      --text-muted: #7a7260;
    }
    html,
    body {
      height: 100%;
    }
    body {
      font-family: 'Outfit', 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Ambient Background ─── */
    #gradientBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(212, 168, 75, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(212, 168, 75, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 0%, rgba(248, 228, 180, 0.03) 0%, transparent 50%);
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Envelope Screen ─── */
    #envelopeScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: var(--ink);
      transition: opacity 1s ease;
    }
    .env-wrap {
      position: relative;
      width: 300px;
      height: 190px;
      cursor: pointer;
      perspective: 1000px;
    }
    .env-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #1f1b16 0%, #12100d 100%);
      border: 1px solid var(--gold-line);
      border-radius: 6px;
      z-index: 1;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .env-body::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: linear-gradient(to bottom, rgba(212, 168, 75, 0.03), rgba(0, 0, 0, 0.2));
      border-radius: 0 0 6px 6px;
    }
    .env-flap {
      position: absolute;
      top: 1px;
      left: 0;
      right: 0;
      height: 106px;
      background: linear-gradient(175deg, #28231c 0%, #1c1813 60%, #14120e 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 3;
      transform-origin: top center;
      transition: transform 1s cubic-bezier(0.76, 0, 0.18, 1);
      border-radius: 6px 6px 0 0;
    }
    .env-flap::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent 5%, var(--gold-line) 30%, rgba(232, 201, 122, 0.6) 50%, var(--gold-line) 70%, transparent 95%);
    }
    .env-wrap.open .env-flap {
      transform: rotateX(190deg);
    }
    .env-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      z-index: 6;
      background: radial-gradient(circle at 38% 30%, #f5e6c0, #d4a84b 50%, #b8942e);
      box-shadow:
        0 0 0 1px rgba(212, 168, 75, 0.5),
        0 0 0 6px rgba(212, 168, 75, 0.07),
        0 4px 24px rgba(212, 168, 75, 0.35);
      transition: opacity 0.5s ease, transform 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .env-wrap.open .env-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }
    .env-seal svg {
      width: 30px;
      height: 30px;
      display: block;
    }
    .env-seal-ring {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1px solid rgba(212, 168, 75, 0.15);
      animation: sealPulse 3s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }
    .env-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--gold);
      opacity: 0.6;
      text-align: center;
      line-height: 2;
      animation: labelGlow 3s ease-in-out infinite;
    }
    @keyframes labelGlow {
      0%,
      100% {
        opacity: 0.5;
      }
      50% {
        opacity: 0.85;
      }
    }
    .env-hint {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.6;
      animation: scrollBob 2.5s ease-in-out infinite;
    }
    @keyframes scrollBob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(6px);
      }
    }

    @media (max-width: 500px) {
      .env-wrap {
        width: 260px;
        height: 168px;
      }
      .env-flap {
        height: 94px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient -->
  <div id="gradientBg"></div>
  <div class="grain"></div>
  <canvas id="particles"></canvas>

  <!-- ══ ENVELOPE ══ -->
  <div id="envelopeScreen">
    <div class="env-wrap" id="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal-ring"></div>
      <div class="env-seal">
        <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 25.2 C9.7 20.4 4.6 17.1 4.6 12.3 C4.6 8.9 7.2 6.4 10.4 6.4 C12.4 6.4 13.9 7.6 15 9.5 C16.1 7.6 17.6 6.4 19.6 6.4 C22.8 6.4 25.4 8.9 25.4 12.3 C25.4 17.1 20.3 20.4 15 25.2 Z" stroke="rgba(0,0,0,0.5)" stroke-width="1" stroke-linejoin="round" fill="rgba(0,0,0,0.2)"/>
          <path d="M15 21.6 C11.3 18.2 8.2 16 8.2 12.9 C8.2 10.8 9.8 9.3 11.7 9.3 C12.9 9.3 14 10 15 11.2 C16 10 17.1 9.3 18.3 9.3 C20.2 9.3 21.8 10.8 21.8 12.9 C21.8 16 18.7 18.2 15 21.6 Z" stroke="rgba(0,0,0,0.3)" stroke-width="0.5" stroke-linejoin="round" fill="none"/>
          <path d="M8.2 11 C8.8 9.6 9.9 8.6 11.2 8.2" stroke="rgba(255,255,255,0.35)" stroke-width="0.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>
    <div class="env-label">UNTUK RAHMA SEPTIANI<br>AKU MENGUNDANGMU!</div>
    <div class="env-hint">Ketuk untuk membuka</div>
  </div>

  <script>
    /* ═══ PARTICLES ═══ */
    (function() {
      var c = document.getElementById('particles'),
        ctx = c.getContext('2d');

      function resize() {
        c.width = innerWidth;
        c.height = innerHeight
      }
      resize();
      window.addEventListener('resize', resize);
      var pts = [];
      for (var i = 0; i < 60; i++) pts.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        s: Math.random() * 2 + 0.5,
        v: Math.random() * 0.3 + 0.1,
        o: Math.random() * 0.4 + 0.15,
        hue: 35 + Math.random() * 20
      });

      function loop() {
        ctx.clearRect(0, 0, c.width, c.height);
        pts.forEach(function(p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + p.hue + ', 40%, 65%, ' + p.o + ')';
          ctx.fill();
          p.y -= p.v;
          if (p.y < -10) {
            p.y = c.height + 10;
            p.x = Math.random() * c.width;
          }
        });
        requestAnimationFrame(loop);
      }
      loop();
    })();

    /* ═══ ENVELOPE OPEN → LANJUT KE UNDANGAN ═══ */
    (function() {
      var env = document.getElementById('envelope'),
        screen = document.getElementById('envelopeScreen'),
        done = false;
      env.addEventListener('click', function() {
        if (done) return;
        done = true;
        env.classList.add('open');
        setTimeout(function() {
          screen.style.opacity = '0';
          setTimeout(function() {
            location.replace('index.html');
          }, 1000);
        }, 900);
      });
    })();
  </script>

</body>
</html>
