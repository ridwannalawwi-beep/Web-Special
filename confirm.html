<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi — 365 Hari Bersamamu</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --gold: #d4a84b;
      --gold-soft: #f0dfb0;
      --gold-glow: rgba(212, 168, 75, 0.25);
      --gold-line: rgba(212, 168, 75, 0.2);
      --ink: #0c0b0a;
      --surface-glass: rgba(18, 17, 15, 0.65);
      --text: #e8e4dc;
      --text-soft: #a8a090;
      --text-muted: #7a7260;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #gradientBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(212, 168, 75, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(212, 168, 75, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 0%, rgba(248, 228, 180, 0.03) 0%, transparent 50%);
    }
    canvas#particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(92%, 480px);
      padding: 56px 44px;
      background: var(--surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--gold-line);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 60px rgba(212, 168, 75, 0.06);
      text-align: center;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .container.reveal {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .container::before,
    .container::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
    }
    .container::before { top: 32px; }
    .container::after { bottom: 32px; }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      letter-spacing: 6px;
      font-size: clamp(18px, 3.5vw, 24px);
      margin-bottom: 36px;
      background: linear-gradient(135deg, #fff, var(--gold-soft), var(--gold));
      background-size: 200%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: shimmerText 6s ease-in-out infinite alternate;
    }
    @keyframes shimmerText {
      0% { background-position: 0% center; }
      100% { background-position: 100% center; }
    }

    textarea, select {
      width: 100%;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(212, 168, 75, 0.2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.35s, box-shadow 0.35s;
    }
    .field {
      margin-bottom: 16px;
      text-align: left;
    }
    .field label {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.3px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .field label em {
      font-style: normal;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      margin-right: 14px;
    }
    .field textarea {
      margin-bottom: 0;
    }

    /* toast notif */
    .toast-wrap {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: min(90vw, 340px);
    }
    .toast {
      transform: translateX(130%);
      opacity: 0;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--gold-line);
      border-left: 2px solid var(--gold);                                                                                                                                                                                                                                                                                                                                                         
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      color: var(--gold-soft);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px var(--gold-glow);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    textarea::placeholder, select::placeholder {
      color: var(--text-muted);
    }
    textarea:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 16px var(--gold-glow);
    }
    textarea {
      min-height: 100px;
      resize: none;
    }
    select {
      appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23d4a84b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 12px;
    }
    select option {
      background: #1a1815;
      color: var(--text);
    }

    button {
      padding: 14px 40px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      position: relative;
      overflow: hidden;
      transition: color 0.4s, background 0.4s, transform 0.3s, box-shadow 0.4s;
      margin-top: 4px;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 120%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: 0.7s;
    }
    button:hover::before { left: 120%; }
    button:hover {
      background: var(--gold);
      color: #0a0800;
      box-shadow: 0 0 32px var(--gold-glow), 0 0 60px rgba(212, 168, 75, 0.12);
      transform: translateY(-2px);
    }

    /* overlay */
    .romantic-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .romantic-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    .romantic-content {
      text-align: center;
      max-width: 420px;
      padding: 20px;
      animation: fadeUp 1.4s ease forwards;
    }
    .romantic-content h2 {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      letter-spacing: 4px;
      font-size: clamp(24px, 4vw, 32px);
      color: var(--gold);
      margin-bottom: 16px;
      text-shadow: 0 0 20px var(--gold-glow), 0 0 50px rgba(212, 168, 75, 0.2);
    }
    .romantic-content p {
      font-size: 15px;
      color: var(--text-soft);
      font-weight: 300;
      line-height: 1.8;
      letter-spacing: 0.3px;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* page entrance */
    body.page-enter {
      opacity: 0;
      filter: blur(6px);
      transform: scale(1.02);
    }
    body.page-show {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
      transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease;
    }

    @media (max-width: 500px) {
      .container { padding: 40px 24px; }
      h1 { font-size: 20px; letter-spacing: 4px; margin-bottom: 28px; }
      textarea, select { font-size: 13px; padding: 12px 14px; }
      button { font-size: 10px; padding: 12px 32px; letter-spacing: 2px; }
    }
  </style>
</head>
<body class="page-enter">
  <div id="gradientBg"></div>
  <div class="grain"></div>
  <canvas id="particles"></canvas>

  <audio id="bgMusic" loop preload="metadata" playsinline>
    <source src="alkateri.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>ISI DULU YA</h1>
    <form id="rsvpForm">
      <div class="field">
        <label><em>1.</em>Berikan puisi yang berkaitan dengan aku, minimal 8 bait</label>
        <textarea id="poem"></textarea>
      </div>
      <div class="field">
        <label><em>2.</em>Ceritakan apa yang kamu rasakan di dalam hubungan ini selama 365 hari bersamaku</label>
        <textarea id="story"></textarea>
      </div>
      <div class="field">
        <label><em>3.</em>Berikan semua kesan pesan dan unek unek kamu saat ketika kita menginjak 365 hari bersama</label>
        <textarea id="kesan"></textarea>
      </div>
      <select required>
        <option value="">Apakah kamu akan hadir?</option>
        <option>Ya, aku akan hadir 🤍</option>
        <option>Maaf, aku tidak bisa hadir</option>
      </select>
      <button type="submit">KIRIM KONFIRMASI</button>
    </form>
  </div>

  <div class="romantic-overlay" id="romanticOverlay">
    <div class="romantic-content">
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    (function() {
      var c = document.getElementById('particles'),
        ctx = c.getContext('2d');

      function resize() {
        c.width = innerWidth;
        c.height = innerHeight
      }
      resize();
      window.addEventListener('resize', resize);
      var pts = [];
      for (var i = 0; i < 60; i++) pts.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        s: Math.random() * 2 + 0.5,
        v: Math.random() * 0.3 + 0.1,
        o: Math.random() * 0.4 + 0.15,
        hue: 35 + Math.random() * 20
      });

      function loop() {
        ctx.clearRect(0, 0, c.width, c.height);
        pts.forEach(function(p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + p.hue + ', 40%, 65%, ' + p.o + ')';
          ctx.fill();
          p.y -= p.v;
          if (p.y < -10) {
            p.y = c.height + 10;
            p.x = Math.random() * c.width;
          }
        });
        requestAnimationFrame(loop);
      }
      loop();
    })();

    window.addEventListener("load", function() {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      document.body.classList.remove("page-enter");
      document.body.classList.add("page-show");
      document.querySelector(".container").classList.add("reveal");

      var music = document.getElementById("bgMusic");
      music.volume = 0;
      music.play().then(function() {
        var from = 0,
          to = 0.6,
          steps = Math.max(1, Math.round(5000 / 25)),
          n = 0;
        var t = setInterval(function() {
          n++;
          var p = n / steps,
            e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          music.volume = Math.min(1, Math.max(0, from + (to - from) * e));
          if (n >= steps) { clearInterval(t); }
        }, 25);
      }).catch(function() {});
    });

    var form = document.getElementById("rsvpForm");
    var overlay = document.getElementById("romanticOverlay");
    var title = overlay.querySelector("h2");
    var textEl = overlay.querySelector("p");
    var scriptURL = "https://script.google.com/macros/s/AKfycbykF4iQn_8QoNKNNK-Oe10sQHbmjMeMTXdBUKpNzQ_nt958R9yHFNK0z7l8U3wk9YI0dw/exec";
    var phoneNumber = "6282115295634";

    var toastWrap = document.getElementById("toastWrap");

    function showToast(text) {
      var t = document.createElement("div");
      t.className = "toast";
      t.textContent = text;
      toastWrap.appendChild(t);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { t.classList.add("show"); });
      });
      setTimeout(function() {
        t.classList.remove("show");
        setTimeout(function() { t.remove(); }, 600);
      }, 3200);
    }

    function typeWriter(el, text, speed) {
      el.textContent = "";
      var i = 0;

      function typing() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(typing, speed);
        }
      }
      typing();
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      var message = document.getElementById("poem").value;
      var story = document.getElementById("story").value;
      var kesan = document.getElementById("kesan").value;
      var attendance = form.querySelector("select").value;
      var notices = [];
      if (!attendance) notices.push("Pilih dulu kehadiranmu ya.....");
      if (!message.trim()) notices.push("Puisi untukku belum ada, isi dulu ya.....");
      if (!story.trim()) notices.push("Ceritakan perasaanmu dulu ya.....");
      if (!kesan.trim()) notices.push("Kesan pesanmu belum ada, isi dulu ya.....");
      if (notices.length) { notices.forEach(showToast); return; }
      try {
        await fetch(scriptURL, { method: "POST", body: JSON.stringify({ poem: message, story: story, kesan: kesan, attendance: attendance }) });
      } catch (err) {}
      overlay.classList.add("show");
      var waAttendance = attendance === "Maaf, aku tidak bisa hadir" ? "Ya, aku akan hadir 🤍" : attendance;
      if (attendance === "Ya, aku akan hadir 🤍") {
        typeWriter(title, "Sampai Jumpa.....", 80);
        setTimeout(function() { typeWriter(textEl, "Aku akan menantikan momen indah itu bersamamu.", 40); }, 1500);
      } else {
        typeWriter(title, "Terima Kasih 🤍", 80);
        setTimeout(function() { typeWriter(textEl, "Pesanmu sudah sampai.", 40); }, 1500);
      }
      setTimeout(function() {
        var music = document.getElementById("bgMusic");
        if (music) { music.pause();
          music.currentTime = 0; }
        window.location.href = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent("Haii sayangg\n" + waAttendance);
      }, 5000);
    });
  </script>
</body>
</html>
